name: Hourly Refresh Cron

on:
  schedule:
    - cron: '0 * * * *' # Runs at the start of every hour
  workflow_dispatch: # Allows you to trigger this manually from the GitHub Actions tab

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Refresh Endpoint
        run: |
          if [ -z "${{ secrets.PRODUCTION_URL }}" ]; then
            echo "Error: PRODUCTION_URL secret is not defined in GitHub Secrets."
            exit 1
          fi
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "Error: CRON_SECRET secret is not defined in GitHub Secrets."
            exit 1
          fi

          echo "Triggering API refresh..."
          curl -f -X GET "${{ secrets.PRODUCTION_URL }}/api/cron/refresh" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
