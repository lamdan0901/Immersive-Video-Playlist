<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immersive Video Playlist</title>
	<link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* Base Reset */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f0f0f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .fullscreen-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        /* Blank State Message */
        .blank-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #888;
            font-size: 24px;
            text-align: center;
            z-index: 5;
        }

        /* Video Player */
        .fullscreen-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none; /* Hidden by default until links are added */
        }

        .fullscreen-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: none;
            background: #000;
        }

        /* Top Left Counter Overlay */
        .counter-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            backdrop-filter: blur(4px);
            pointer-events: none;
            display: none;
        }

        /* Floating Action Buttons (Top Right) */
        .action-btn {
            position: absolute;
            right: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: auto;
            min-width: 45px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        #nextBtn {
            top: 70px;
            display: none;
        }

        #editBtn {
            top: 120px;
        }

        #playlistsBtn {
            top: 170px;
            font-size: 18px; /* Slightly larger icon */
        }

        /* Slide-out Panels */
        .editor-panel {
            position: absolute;
            top: 0;
            height: 100%;
            background: rgba(15, 15, 15, 0.95);
            z-index: 50;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(15px);
        }

        /* Right Panel (Editor) */
        .editor-panel.right-panel {
            right: -750px; /* Hidden off-screen */
            width: 700px;
            border-left: 1px solid #333;
            transition: right 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .editor-panel.right-panel.open {
            right: 0;
        }

        /* Playlists Panel (Right) */
        .editor-panel.playlists-panel {
            right: -400px; /* Hidden off-screen */
            width: 400px;
            border-left: 1px solid #333;
            transition: right 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .editor-panel.playlists-panel.open {
            right: 0;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: white;
        }

        .editor-header h3 {
            margin: 0;
            font-size: 18px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: white;
        }

        .name-input {
            background: #000;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 12px;
            font-size: 14px;
            margin-bottom: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100%;
            box-sizing: border-box;
        }

        .name-input:focus {
            outline: none;
            border-color: #666;
        }

        .editor-panel textarea {
            flex-grow: 1;
            background: #000;
            color: #00ffcc; /* Terminal style green/cyan text */
            border: 1px solid #444;
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            resize: none;
            margin-bottom: 15px;
            white-space: pre;
            overflow-wrap: normal;
            overflow-x: auto;
        }

        .editor-panel textarea:focus {
            outline: none;
            border-color: #666;
        }

        .save-btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            flex: 1;
        }

        .save-btn:hover {
            background: #e0e0e0;
        }

        .save-btn.primary {
            background: #00ffcc;
            color: #000;
        }
        
        .save-btn.primary:hover {
            background: #00e6b8;
        }

        /* Playlists List Styles */
        .playlists-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        .playlist-item {
            padding: 15px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s, border-color 0.2s;
        }

        .playlist-item:hover {
            background: #2a2a2a;
        }

        .playlist-item.active {
            border-color: #00ffcc;
            background: #11221f;
        }

        .playlist-item-title {
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 10px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff4444;
            cursor: pointer;
            font-size: 16px;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .delete-btn:hover {
            color: #ff0000;
            background: rgba(255, 68, 68, 0.1);
        }
    </style>
</head>
<body>

<div class="fullscreen-wrapper">
    <!-- Blank State -->
    <div id="blankState" class="blank-state">
        <div style="font-size: 40px; margin-bottom: 10px;">🍿</div>
        No playlist loaded.<br>Click "Edit Playlist" to add links.
    </div>

    <!-- UI Overlays -->
    <div class="counter-overlay" id="videoCounter"></div>
    <button id="nextBtn" class="action-btn" title="Next Video (Ctrl+Alt+X)">&rarr;</button>
    <button id="editBtn" class="action-btn" title="Edit Playlist">✎</button>
    <button id="playlistsBtn" class="action-btn" title="My Playlists">☰</button>

    <!-- The Video Player -->
    <iframe id="videoPlayer" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
    <video id="videoPlayerNative" controls autoplay></video>
    
    <!-- Playlists Slide-out Panel (Right) -->
    <div id="playlistsPanel" class="editor-panel playlists-panel">
        <div class="editor-header">
            <h3>My Playlists</h3>
            <button id="closePlaylistsBtn" class="close-btn">&times;</button>
        </div>
        <div id="playlistsContainer" class="playlists-list">
            <!-- Playlists dynamically added here -->
        </div>
    </div>

    <!-- Editor Slide-out Panel (Right) -->
    <div id="editorPanel" class="editor-panel right-panel">
        <div class="editor-header">
            <h3>Playlist Data</h3>
            <button id="closePanelBtn" class="close-btn">&times;</button>
        </div>
        <input type="text" id="playlistNameInput" class="name-input" placeholder="Playlist Name">
        <p style="color: #888; font-size: 12px; margin-top: 0; margin-bottom: 10px;">Format: <code>Episode_Number|URL</code> (embed links or .m3u8 streams)</p>
        <textarea id="playlistInput" placeholder="1|https://embed14...&#10;2|https://embed14..."></textarea>
        <div style="display: flex; gap: 10px;">
            <button id="saveBtn" class="save-btn">Save Current</button>
            <button id="saveNewBtn" class="save-btn primary">Save as New</button>
        </div>
    </div>
</div>

<script>
    // App State
    let playlists = [];
    let currentPlaylistId = null;
    let activePlaylist = null;
    let playlist = []; // parsed active playlist array
    let currentIndex = 0;
    let hlsInstance = null;

    // DOM Elements
    const player = document.getElementById('videoPlayer');
    const playerNative = document.getElementById('videoPlayerNative');
    const counterText = document.getElementById('videoCounter');
    const nextBtn = document.getElementById('nextBtn');
    const editBtn = document.getElementById('editBtn');
    const playlistsBtn = document.getElementById('playlistsBtn');
    
    const editorPanel = document.getElementById('editorPanel');
    const playlistsPanel = document.getElementById('playlistsPanel');
    
    const closePanelBtn = document.getElementById('closePanelBtn');
    const closePlaylistsBtn = document.getElementById('closePlaylistsBtn');
    
    const saveBtn = document.getElementById('saveBtn');
    const saveNewBtn = document.getElementById('saveNewBtn');
    
    const playlistInput = document.getElementById('playlistInput');
    const playlistNameInput = document.getElementById('playlistNameInput');
    const playlistsContainer = document.getElementById('playlistsContainer');
    const blankState = document.getElementById('blankState');

    // --- Core Logic ---

    function isM3u8Url(url) {
        return /\.m3u8(\?|$)/i.test(url);
    }

    // 1. Initialize from LocalStorage
    function init() {
        // Migrate old data if necessary or load existing playlists
        const savedPlaylists = localStorage.getItem('playlists');
        if (savedPlaylists) {
            playlists = JSON.parse(savedPlaylists);
            currentPlaylistId = localStorage.getItem('currentPlaylistId');
        } else {
            const oldRawText = localStorage.getItem('rawPlaylistText');
            if (oldRawText && oldRawText.trim() !== '') {
                const defaultId = Date.now().toString();
                playlists.push({
                    id: defaultId,
                    name: 'Default Playlist',
                    rawText: oldRawText,
                    currentIndex: 0
                });
                currentPlaylistId = defaultId;
                savePlaylistsToStorage();
            }
        }

        if (playlists.length > 0 && currentPlaylistId) {
            loadPlaylistData(currentPlaylistId, false);
        } else {
            updateUI(); // Renders the blank state
        }
        renderPlaylistsList();
    }

    function savePlaylistsToStorage() {
        localStorage.setItem('playlists', JSON.stringify(playlists));
        if (currentPlaylistId) {
            localStorage.setItem('currentPlaylistId', currentPlaylistId);
        } else {
            localStorage.removeItem('currentPlaylistId');
        }
    }

    function loadPlaylistData(playlistId, forceReload = true) {
        currentPlaylistId = playlistId;
        activePlaylist = playlists.find(p => p.id === playlistId);
        
        if (activePlaylist) {
            playlistInput.value = activePlaylist.rawText;
            playlistNameInput.value = activePlaylist.name;
            
            parseAndLoadPlaylist(activePlaylist.rawText);
            currentIndex = activePlaylist.currentIndex || 0;
            
            if (currentIndex >= playlist.length) currentIndex = Math.max(0, playlist.length - 1);
            activePlaylist.currentIndex = currentIndex; // Ensure valid
            savePlaylistsToStorage();
            
            if (forceReload || !player.src) {
                updateUI(true);
            } else {
                updateUI(false); 
            }
        } else {
            playlistInput.value = '';
            playlistNameInput.value = '';
            playlist = [];
            currentIndex = 0;
            updateUI(true);
        }
    }

    // 2. Parse Text into Array of Objects
    function parseAndLoadPlaylist(rawText) {
        const lines = rawText.split('\n');
        const parsedList = [];

        lines.forEach(line => {
            if (!line.trim()) return; 
            
            const parts = line.split('|');
            if (parts.length >= 2) {
                const epNum = parts[0].trim();
                const url = parts.slice(1).join('|').trim();
                parsedList.push({ ep: epNum, url: url });
            }
        });

        playlist = parsedList;
    }

    // 3. Update DOM based on App State
    function updateUI(reloadVideo = true) {
        if (playlist.length === 0) {
            // Show blank state
            player.style.display = 'none';
            playerNative.style.display = 'none';
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            counterText.style.display = 'none';
            nextBtn.style.display = 'none';
            blankState.style.display = 'block';
            player.src = "";
            playerNative.src = "";
            return;
        }

        // Hide blank state
        blankState.style.display = 'none';
        counterText.style.display = 'block';

        // Load current video
        const currentItem = playlist[currentIndex];

        if (reloadVideo) {
            if (isM3u8Url(currentItem.url)) {
                // M3U8: show native video player, hide iframe
                player.style.display = 'none';
                playerNative.style.display = 'block';
                if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
                if (Hls.isSupported()) {
                    hlsInstance = new Hls();
                    hlsInstance.loadSource(currentItem.url);
                    hlsInstance.attachMedia(playerNative);
                } else if (playerNative.canPlayType('application/vnd.apple.mpegurl')) {
                    playerNative.src = currentItem.url;
                }
            } else {
                // Embed: show iframe, hide native video player
                playerNative.style.display = 'none';
                playerNative.pause();
                playerNative.src = "";
                if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
                player.style.display = 'block';
                player.src = currentItem.url;
            }
        }
        
        // Update Counter Text
        counterText.innerText = `Ep ${currentItem.ep} • (${currentIndex + 1} / ${playlist.length})`;
        
        // Handle Next Button Visibility
        if (currentIndex >= playlist.length - 1) {
            nextBtn.style.display = 'none'; // Hide if on last video
        } else {
            nextBtn.style.display = 'block'; // Show otherwise
        }
    }

    function renderPlaylistsList() {
        playlistsContainer.innerHTML = '';
        
        if (playlists.length === 0) {
            playlistsContainer.innerHTML = '<p style="color: #888;">No playlists saved.</p>';
            return;
        }
        
        playlists.forEach(p => {
            const item = document.createElement('div');
            item.className = `playlist-item ${p.id === currentPlaylistId ? 'active' : ''}`;
            
            const titleSpan = document.createElement('span');
            titleSpan.className = 'playlist-item-title';
            titleSpan.innerText = p.name || 'Untitled Playlist';
            
            const delBtn = document.createElement('button');
            delBtn.innerHTML = '&#128465;'; // Trash can icon
            delBtn.className = 'delete-btn';
            delBtn.title = 'Delete Playlist';
            delBtn.onclick = (e) => {
                e.stopPropagation();
                if (confirm('Are you sure you want to delete this playlist?')) {
                    playlists = playlists.filter(pl => pl.id !== p.id);
                    if (currentPlaylistId === p.id) {
                        currentPlaylistId = playlists.length > 0 ? playlists[0].id : null;
                        if (currentPlaylistId) {
                            loadPlaylistData(currentPlaylistId, true);
                        } else {
                            activePlaylist = null;
                            playlist = [];
                            updateUI(true);
                        }
                    }
                    savePlaylistsToStorage();
                    renderPlaylistsList();
                }
            };
            
            item.appendChild(titleSpan);
            item.appendChild(delBtn);
            
            item.onclick = () => {
                if (p.id !== currentPlaylistId) {
                    loadPlaylistData(p.id, true);
                    renderPlaylistsList();
                }
                playlistsPanel.classList.remove('open');
            };
            
            playlistsContainer.appendChild(item);
        });
    }

    function createNewPlaylist(name, rawText) {
        const newId = Date.now().toString();
        const newPlaylist = {
            id: newId,
            name: name,
            rawText: rawText,
            currentIndex: 0
        };
        playlists.push(newPlaylist);
        currentPlaylistId = newId;
        activePlaylist = newPlaylist;
        parseAndLoadPlaylist(rawText);
        currentIndex = 0;
    }

    // --- Event Listeners ---

    function playNextVideo() {
        if (currentIndex < playlist.length - 1) {
            currentIndex++;
            if (activePlaylist) {
                activePlaylist.currentIndex = currentIndex;
                savePlaylistsToStorage();
            }
            updateUI(true);
            window.focus(); // Regain focus to main window to keep shortcuts working
        }
    }

    // Next Video Logic
    nextBtn.addEventListener('click', playNextVideo);

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
        // e.code is more robust for modifier + key combinations
        if (e.ctrlKey && e.altKey && e.code === 'KeyX') {
            e.preventDefault();
            playNextVideo();
        } else if (e.key === 'Escape') {
            if (editorPanel.classList.contains('open')) {
                editorPanel.classList.remove('open');
            }
            if (playlistsPanel.classList.contains('open')) {
                playlistsPanel.classList.remove('open');
            }
        }
    }, true); // Use capture phase to intercept early

    // Open Editor Panel
    editBtn.addEventListener('click', () => {
        editorPanel.classList.add('open');
        playlistsPanel.classList.remove('open'); // Close other panel
    });

    // Open Playlists Panel
    playlistsBtn.addEventListener('click', () => {
        renderPlaylistsList();
        playlistsPanel.classList.add('open');
        editorPanel.classList.remove('open'); // Close other panel
    });

    // Close Panels
    closePanelBtn.addEventListener('click', () => {
        editorPanel.classList.remove('open');
    });

    closePlaylistsBtn.addEventListener('click', () => {
        playlistsPanel.classList.remove('open');
    });

    // Save Current
    saveBtn.addEventListener('click', () => {
        const rawText = playlistInput.value;
        const name = playlistNameInput.value.trim() || 'Untitled Playlist';
        
        if (activePlaylist) {
            activePlaylist.rawText = rawText;
            activePlaylist.name = name;
            parseAndLoadPlaylist(rawText);
            
            if (currentIndex >= playlist.length) {
                currentIndex = Math.max(0, playlist.length - 1);
            }
            activePlaylist.currentIndex = currentIndex;
        } else {
            createNewPlaylist(name, rawText);
        }
        
        savePlaylistsToStorage();
        updateUI(true);
        renderPlaylistsList();
        editorPanel.classList.remove('open');
    });

    // Save as New
    saveNewBtn.addEventListener('click', () => {
        const rawText = playlistInput.value;
        const name = playlistNameInput.value.trim() || 'New Playlist';
        createNewPlaylist(name, rawText);
        
        savePlaylistsToStorage();
        updateUI(true);
        renderPlaylistsList();
        editorPanel.classList.remove('open');
    });

    // Start App
    init();

</script>
</body>
</html>
